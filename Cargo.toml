[workspace]
resolver = "2"

members = [
    "dupion",
    "platter-walk",
    "reapfrog",
    "libarchive-rust",
    "rust-btrfs",
]

[profile.release]
#debug = true
#strip = false
codegen-units = 1
lto = true

[profile.release.package.proc-macro2]
opt-level = 0
[profile.release.package.quote]
opt-level = 0
[profile.release.package.syn]
opt-level = 0
[profile.release.package.serde_derive]
opt-level = 0

[patch."https://github.com/qwertz19281/dupion_glommio"]
#glommio = { path = "../dupion_glommio/glommio" }
